<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rent Collection — PropertyManager</title>
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/sidebar.css">
<link rel="stylesheet" href="css/tables.css">
<link rel="stylesheet" href="css/forms.css">
<link rel="stylesheet" href="css/modal.css">
<link rel="stylesheet" href="css/mobile.css">
</head>
<body>
  <aside class="sidebar" id="navPlaceholder"></aside>
  <main class="main-content">
    <div class="page-header">
      <h1>Rent Collection</h1>
      <button class="btn btn-primary" id="addRentBtn">+ Add rent record</button>
    </div>
    <div class="filter-bar">
      <select id="filterStatus">
        <option value="">All statuses</option>
        <option value="Pending">Pending</option>
        <option value="Partial">Partial</option>
        <option value="Paid">Paid</option>
        <option value="Overdue">Overdue</option>
      </select>
    </div>
    <div id="rentList"></div>
  </main>
  <nav class="bottom-nav" id="bottomNavPlaceholder"></nav>
  <script type="module" src="js/rent.js"></script>
</body>
</html>
